<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Búsquedas | KYOKO API</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.google.com/recaptcha/api.js?render=6Lfc8-AsAAAAADKv1oLBvDpQE_AYT_ghdsmRU0Kz"></script>

    <style>
        :root { 
            --neon-blue: #c084fc; 
            --neon-purple: #9333ea;
            --dark-bg: #0a0414; 
            --card-bg: #130b20; 
            --text-main: #f0eaff; 
            --code-bg: #0e0719; 
            --border-color: rgba(147, 51, 234, 0.3);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Modo claro real */
        body.light-mode {
            --dark-bg: #f8f7fc;
            --card-bg: #ffffff;
            --text-main: #1e1b2e;
            --code-bg: #f0eff5;
            --border-color: rgba(147, 51, 234, 0.2);
        }

        body { 
            background-color: var(--dark-bg); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            transition: background-color var(--transition), color var(--transition);
        }
        #safety-block { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; 
        }
        
        /* Contenedor principal de la card */
        .glass { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 24px; 
            transition: background var(--transition), border var(--transition);
        }
        
        /* Bloque de código de la URL */
        .code-box { 
            background: var(--code-bg); 
            padding: 12px; 
            border-radius: 12px; 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 0.7rem; 
            color: var(--neon-blue); 
            border: 1px solid var(--border-color); 
            word-break: break-all; 
            margin: 15px 0; 
            transition: background var(--transition), border var(--transition);
        }
        
        .input-test { 
            width: 100%; 
            background: var(--code-bg); 
            border: 1px solid var(--border-color); 
            padding: 14px; 
            border-radius: 12px; 
            color: var(--text-main); 
            outline: none; 
            font-size: 0.85rem; 
            transition: background var(--transition), border var(--transition);
        }
        .input-test:focus { border-color: var(--neon-blue); box-shadow: 0 0 0 2px rgba(192, 132, 252, 0.2); }
        
        .btn-test { 
            background: linear-gradient(90deg, #a855f7, #6b21a5);
            color: white; 
            border: none; 
            padding: 14px; 
            width: 100%; 
            border-radius: 12px; 
            font-weight: 900; 
            text-transform: uppercase; 
            cursor: pointer; 
            font-size: 0.75rem; 
            transition: 0.3s; 
        }
        .btn-test:hover { filter: brightness(1.15); transform: translateY(-1px); }

        /* El BASH: Cuadro de respuesta con scroll interno fijo */
        .result-box { 
            background: var(--code-bg); 
            color: var(--neon-blue); 
            padding: 15px; 
            border-radius: 12px; 
            margin-top: 15px; 
            font-size: 0.7rem; 
            font-family: 'JetBrains Mono', monospace; 
            border: 1px solid var(--border-color); 
            white-space: pre-wrap; 
            word-break: break-all; 
            height: 350px; /* Altura fija para no dañar el diseño */
            overflow-y: auto; 
            overflow-x: hidden;
            display: none; 
            transition: background var(--transition), border var(--transition);
        }

        /* Estilo del scrollbar para que se vea pro */
        .result-box::-webkit-scrollbar { width: 4px; }
        .result-box::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 10px; }

        .btn-copy-json { 
            background: rgba(147, 51, 234, 0.1); 
            color: var(--text-main); 
            width: 100%; 
            padding: 10px; 
            border-radius: 0 0 15px 15px; 
            font-size: 10px; 
            font-weight: 800; 
            display: none; 
            border-top: 1px solid var(--border-color); 
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-copy-json:hover { background: rgba(147, 51, 234, 0.2); }
        
        h2 { 
            border-left: 5px solid var(--neon-blue); 
            padding-left: 15px; 
            font-weight: 900; 
            color: var(--text-main);
        }
        .grecaptcha-badge { z-index: 9999 !important; }

        header { 
            background: rgba(10, 4, 20, 0.9); 
            backdrop-filter: blur(10px); 
            border-bottom: 1px solid var(--border-color); 
            transition: background var(--transition), border var(--transition);
        }
        body.light-mode header { 
            background: rgba(255, 255, 255, 0.85); 
        }
        .theme-toggle { 
            cursor: pointer; 
            transition: transform 0.3s; 
            color: var(--neon-blue); 
            font-size: 1.2rem;
        }
        .theme-toggle:hover { transform: scale(1.1); }
    </style>
</head>
<body class="min-h-screen pb-10">
    <div id="safety-block"></div>
    <header class="p-4 flex justify-between items-center sticky top-0 z-50">
        <div class="font-black text-xl tracking-tighter cursor-pointer" onclick="location.href='/dash'">
            KYOKO <span style="color: var(--neon-blue)">DASH</span>
        </div>
        <div class="flex items-center gap-4">
            <div class="theme-toggle" onclick="toggleTheme()" id="theme-btn">
                <i class="fas fa-moon"></i>
            </div>
            <button onclick="location.href='/dash'" class="text-xs font-bold bg-white/5 px-4 py-2 rounded-xl border border-white/10">
                <i class="fas fa-home"></i>
            </button>
        </div>
    </header>

    <main class="container mx-auto p-4 max-w-2xl">
        <h2 class="text-xl uppercase tracking-tighter my-6">Búsquedas</h2>

        <div class="glass p-6 mb-1 overflow-hidden">
            <div class="font-bold text-sm uppercase mb-2"><i class="fab fa-pinterest text-red-500"></i> Pinterest Search</div>
            <div class="code-box" id="pin-path">GET /api/search/pinterest?apiKey=</div>
            <input id="in-pin" class="input-test mb-3" placeholder="Buscar imágenes...">
            <button class="btn-test" onclick="testSearch('pin', '/api/search/pinterest')">Ejecutar Pinterest</button>
            <div id="res-pin" class="result-box"></div>
        </div>
        <button id="copy-pin" class="btn-copy-json mb-6" onclick="copyResult('pin')"><i class="fas fa-copy mr-2"></i> COPIAR JSON</button>

        <div class="glass p-6 mb-1 overflow-hidden">
            <div class="font-bold text-sm uppercase mb-2"><i class="fab fa-tiktok"></i> TikTok Search</div>
            <div class="code-box" id="tt-path">GET /api/search/tiktok?apiKey=</div>
            <input id="in-tt" class="input-test mb-3" placeholder="Buscar videos...">
            <button class="btn-test" onclick="testSearch('tt', '/api/search/tiktok')">Ejecutar TikTok</button>
            <div id="res-tt" class="result-box"></div>
        </div>
        <button id="copy-tt" class="btn-copy-json mb-6" onclick="copyResult('tt')"><i class="fas fa-copy mr-2"></i> COPIAR JSON</button>
    </main>

    <script>
        const userData = JSON.parse(localStorage.getItem('kazuma_user'));
        if (!userData) { window.location.href = '/login'; }
        else {
            document.addEventListener("DOMContentLoaded", () => {
                ['pin', 'tt'].forEach(id => {
                    const el = document.getElementById(`${id}-path`);
                    if(el) el.innerText += `${userData.key}&query=...`;
                });
                setTimeout(() => document.getElementById('safety-block').style.display='none', 300);
                loadTheme();
            });
        }

        function toggleTheme() {
            const body = document.body;
            const themeBtn = document.getElementById('theme-btn');
            const icon = themeBtn.querySelector('i');
            body.classList.toggle('light-mode');
            const isLight = body.classList.contains('light-mode');
            icon.classList.replace(isLight ? 'fa-moon' : 'fa-sun', isLight ? 'fa-sun' : 'fa-moon');
            localStorage.setItem('dvwilker-theme', isLight ? 'light' : 'dark');
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('dvwilker-theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
                document.getElementById('theme-btn').querySelector('i').classList.replace('fa-moon', 'fa-sun');
            }
        }

        async function testSearch(id, route) {
            const query = document.getElementById(`in-${id}`).value.trim();
            const resBox = document.getElementById(`res-${id}`);
            const copyBtn = document.getElementById(`copy-${id}`);
            if (!query) return Swal.fire({ icon: 'warning', title: 'Escribe algo', background: 'var(--card-bg)', color: 'var(--text-main)' });

            resBox.style.display = 'block'; 
            resBox.innerText = "ESPERANDO RESPUESTA..."; 
            copyBtn.style.display = 'none';

            try {
                const response = await fetch(`${route}?query=${encodeURIComponent(query)}&apiKey=${userData.key}`);
                const data = await response.json();
                resBox.innerText = JSON.stringify(data, null, 2);
                copyBtn.style.display = 'block';
            } catch (e) { 
                resBox.innerText = "ERROR EN EL SERVIDOR"; 
            }
        }

        function copyResult(id) {
            const text = document.getElementById(`res-${id}`).innerText;
            navigator.clipboard.writeText(text);
            Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Copiado', showConfirmButton: false, timer: 1000, background: 'var(--card-bg)', color: 'var(--text-main)' });
        }

        window.onload = () => {
            grecaptcha.ready(() => { 
                grecaptcha.execute('6Lfc8-AsAAAAANBSrKK28HfImcVCOnribyTlVoSg', {action: 'search_test'}); 
            });
        };
    </script>
</body>
</html>
