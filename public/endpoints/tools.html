<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Herramientas | KYOKO API</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.google.com/recaptcha/api.js?render=6Lfc8-AsAAAAADKv1oLBvDpQE_AYT_ghdsmRU0Kz"></script>

    <style>
        :root { 
            --neon-blue: #c084fc; 
            --neon-purple: #9333ea;
            --dark-bg: #0a0414; 
            --card-bg: #130b20; 
            --text-main: #f0eaff; 
            --code-bg: #0e0719; 
            --border-color: rgba(147, 51, 234, 0.3);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Modo claro real */
        body.light-mode {
            --dark-bg: #f8f7fc;
            --card-bg: #ffffff;
            --text-main: #1e1b2e;
            --code-bg: #f0eff5;
            --border-color: rgba(147, 51, 234, 0.2);
        }

        body { 
            background-color: var(--dark-bg); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            transition: background-color var(--transition), color var(--transition);
        }
        #safety-block { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; 
        }
        .glass { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 24px; 
            transition: background var(--transition), border var(--transition);
        }
        .code-box { 
            background: var(--code-bg); 
            padding: 12px; 
            border-radius: 12px; 
            font-family: monospace; 
            font-size: 0.7rem; 
            color: var(--neon-blue); 
            border: 1px solid var(--border-color); 
            word-break: break-all; 
            margin: 15px 0; 
            transition: background var(--transition), border var(--transition);
        }
        .input-test, select { 
            width: 100%; 
            background: var(--code-bg); 
            border: 1px solid var(--border-color); 
            padding: 14px; 
            border-radius: 12px; 
            color: var(--text-main); 
            outline: none; 
            margin-bottom: 10px; 
            font-size: 0.8rem; 
            transition: background var(--transition), border var(--transition);
        }
        .input-test:focus, select:focus { 
            border-color: var(--neon-blue); 
            box-shadow: 0 0 0 2px rgba(192, 132, 252, 0.2); 
        }
        .btn-test { 
            background: linear-gradient(90deg, #a855f7, #6b21a5);
            color: white; 
            border: none; 
            padding: 14px; 
            width: 100%; 
            border-radius: 12px; 
            font-weight: 900; 
            text-transform: uppercase; 
            cursor: pointer; 
            transition: 0.3s;
        }
        .btn-test:hover { filter: brightness(1.15); transform: translateY(-1px); }
        .img-result { 
            width: 100%; 
            border-radius: 15px; 
            border: 2px solid var(--neon-blue); 
            display: none; 
            margin-top: 15px; 
            transition: border-color var(--transition);
        }
        h2 { 
            border-left: 5px solid var(--neon-blue); 
            padding-left: 15px; 
            font-weight: 900; 
            color: var(--text-main);
        }
        .grecaptcha-badge { 
            width: 70px !important; 
            overflow: hidden !important; 
            transition: 0.3s !important; 
            right: 0px !important; 
            bottom: 20px !important; 
            z-index: 9999 !important; 
        }

        header { 
            background: rgba(10, 4, 20, 0.9); 
            backdrop-filter: blur(10px); 
            border-bottom: 1px solid var(--border-color); 
            transition: background var(--transition), border var(--transition);
        }
        body.light-mode header { 
            background: rgba(255, 255, 255, 0.85); 
        }
        .theme-toggle { 
            cursor: pointer; 
            transition: transform 0.3s; 
            color: var(--neon-blue); 
            font-size: 1.2rem;
        }
        .theme-toggle:hover { transform: scale(1.1); }
    </style>
</head>
<body class="min-h-screen pb-10">
    <div id="safety-block"></div>
    <header class="p-4 flex justify-between items-center sticky top-0 z-50">
        <div class="font-black text-xl tracking-tighter cursor-pointer" onclick="location.href='/dash'">
            KYOKO <span style="color: var(--neon-blue)">DASH</span>
        </div>
        <div class="flex items-center gap-4">
            <div class="theme-toggle" onclick="toggleTheme()" id="theme-btn">
                <i class="fas fa-moon"></i>
            </div>
            <button onclick="location.href='/dash'" class="text-xs font-bold bg-white/5 px-4 py-2 rounded-xl border border-white/10">
                <i class="fas fa-home"></i>
            </button>
        </div>
    </header>

    <main class="container mx-auto p-4 max-w-2xl">
        <h2 class="text-xl uppercase tracking-tighter my-6">Herramientas</h2>

        <div class="glass p-6 mb-6">
            <div class="font-bold text-sm uppercase mb-2"><i class="fas fa-camera text-cyan-400"></i> Screenshot Web</div>
            <div class="code-box" id="ss-path">GET /api/tools/ssweb?apiKey=</div>
            
            <input id="url-ss" class="input-test" placeholder="URL del sitio...">
            <div class="grid grid-cols-2 gap-3">
                <select id="device-ss"><option value="desktop">Escritorio</option><option value="tablet">Tablet</option><option value="phone">Móvil</option></select>
                <select id="theme-ss"><option value="dark">Dark</option><option value="light">Light</option></select>
            </div>
            <button class="btn-test" onclick="testMedia('ssweb')">Capturar Pantalla</button>
            <img id="view-ssweb" class="img-result">
        </div>

        <div class="glass p-6 mb-6">
            <div class="font-bold text-sm uppercase mb-2"><i class="fas fa-qrcode text-cyan-400"></i> QR Generator</div>
            <div class="code-box" id="qr-path">GET /api/tools/qr?apiKey=</div>
            <input id="text-qr" class="input-test" placeholder="Texto o URL...">
            <button class="btn-test" onclick="testMedia('qr')">Generar QR</button>
            <div class="text-center"><img id="view-qr" class="img-result mx-auto !w-48"></div>
        </div>
    </main>

    <script>
        const userData = JSON.parse(localStorage.getItem('kazuma_user'));
        if (!userData) { window.location.href = '/login'; }
        else {
            document.addEventListener("DOMContentLoaded", () => {
                document.getElementById('ss-path').innerText += `${userData.key}&url=...&device=...&theme=...`;
                document.getElementById('qr-path').innerText += `${userData.key}&text=...`;
                setTimeout(() => document.getElementById('safety-block').style.display='none', 300);
                loadTheme();
            });
        }

        function toggleTheme() {
            const body = document.body;
            const themeBtn = document.getElementById('theme-btn');
            const icon = themeBtn.querySelector('i');
            body.classList.toggle('light-mode');
            const isLight = body.classList.contains('light-mode');
            icon.classList.replace(isLight ? 'fa-moon' : 'fa-sun', isLight ? 'fa-sun' : 'fa-moon');
            localStorage.setItem('dvwilker-theme', isLight ? 'light' : 'dark');
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('dvwilker-theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
                document.getElementById('theme-btn').querySelector('i').classList.replace('fa-moon', 'fa-sun');
            }
        }

        async function testMedia(type) {
            const imgEl = document.getElementById(`view-${type}`);
            let finalUrl = "";

            if(type === 'ssweb') {
                const u = document.getElementById('url-ss').value;
                const d = document.getElementById('device-ss').value;
                const t = document.getElementById('theme-ss').value;
                if(!u) return Swal.fire({ title: 'Error', text: 'Ingresa una URL', icon: 'warning', background: 'var(--card-bg)', color: 'var(--text-main)' });
                finalUrl = `/api/tools/ssweb?url=${encodeURIComponent(u)}&device=${d}&theme=${t}&apiKey=${userData.key}`;
            } else {
                const txt = document.getElementById('text-qr').value;
                if(!txt) return Swal.fire({ title: 'Error', text: 'Ingresa texto', icon: 'warning', background: 'var(--card-bg)', color: 'var(--text-main)' });
                finalUrl = `/api/tools/qr?text=${encodeURIComponent(txt)}&apiKey=${userData.key}`;
            }

            Swal.fire({ title: 'Procesando...', allowOutsideClick: false, didOpen: () => Swal.showLoading(), background: 'var(--card-bg)', color: 'var(--text-main)' });
            imgEl.src = finalUrl;
            imgEl.onload = () => { imgEl.style.display = 'block'; Swal.close(); };
            imgEl.onerror = () => { Swal.fire({ title: 'Error', text: 'No se pudo generar la imagen', icon: 'error', background: 'var(--card-bg)', color: 'var(--text-main)' }); };
        }

        window.onload = () => {
            grecaptcha.ready(() => { 
                grecaptcha.execute('6Lfc8-AsAAAAANBSrKK28HfImcVCOnribyTlVoSg', {action: 'search_test'}); 
            });
        };
    </script>
</body>
</html>
