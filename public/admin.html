<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KYOKO API | Staff Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { 
            --neon-pink: #c084fc; 
            --neon-blue: #a855f7; 
            --dark-bg: #0a0414; 
            --card-bg: #130b20; 
            --text-main: #f0eaff; 
            --text-muted: #b8a9d4; 
            --border-color: rgba(147, 51, 234, 0.3);
            --input-bg: rgba(0,0,0,0.3);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Modo claro real */
        body.light-mode {
            --dark-bg: #f8f7fc;
            --card-bg: #ffffff;
            --text-main: #1e1b2e;
            --text-muted: #6b5d8f;
            --border-color: rgba(147, 51, 234, 0.2);
            --input-bg: rgba(0,0,0,0.03);
        }

        body { 
            background-color: var(--dark-bg) !important; 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            transition: background-color var(--transition), color var(--transition);
        }
        .glass { 
            background: var(--card-bg); 
            backdrop-filter: blur(10px); 
            border: 1px solid var(--border-color); 
            transition: background var(--transition), border var(--transition);
        }
        .input-dark { 
            background: var(--input-bg); 
            border: 1px solid var(--border-color); 
            color: var(--text-main); 
            font-size: 13px; 
            transition: background var(--transition), border var(--transition);
        }
        .input-dark:focus { border-color: var(--neon-blue); outline: none; box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.2); }
        .btn-filter { 
            padding: 10px; 
            border-radius: 12px; 
            font-size: 10px; 
            font-weight: 900; 
            text-transform: uppercase; 
            border: 1px solid var(--border-color); 
            transition: 0.3s; 
            background: var(--card-bg);
            color: var(--text-muted);
            cursor: pointer;
        }
        .btn-filter.active { 
            border-color: var(--neon-pink); 
            color: var(--neon-pink); 
            background: rgba(192, 132, 252, 0.1); 
        }
        tr { border-bottom: 1px solid var(--border-color); transition: 0.3s; }
        tr:hover { background: rgba(147, 51, 234, 0.05); }
        .badge-premium { background: rgba(168, 85, 247, 0.15); color: var(--neon-blue); border: 1px solid rgba(168, 85, 247, 0.3); }
        .badge-user { background: rgba(255, 255, 255, 0.05); color: var(--text-muted); border: 1px solid var(--border-color); }
        
        /* Estilo idéntico al modal viejo pero con colores morados */
        .swal2-popup { border-radius: 2.5rem !important; border: 1px solid var(--border-color) !important; padding: 2rem !important; background: var(--card-bg) !important; color: var(--text-main) !important; }
        .swal-label { text-align: left; text-transform: uppercase; font-weight: 900; font-size: 10px; color: var(--text-muted); display: block; margin-bottom: 4px; margin-left: 4px; }

        header { background: rgba(10, 4, 20, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color); transition: background var(--transition), border var(--transition); }
        body.light-mode header { background: rgba(255, 255, 255, 0.85); }
        .theme-toggle { cursor: pointer; transition: transform 0.3s; color: var(--neon-pink); }
        .theme-toggle:hover { transform: scale(1.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col" style="display: none;">
    <header class="p-4 border-b flex justify-between items-center sticky top-0 z-50">
        <div class="font-bold text-xl uppercase tracking-tighter">KYOKO <span class="text-[#c084fc]">STAFF</span></div>
        <div class="flex items-center gap-4">
            <div class="theme-toggle" onclick="toggleTheme()" id="theme-btn">
                <i class="fas fa-moon"></i>
            </div>
            <button onclick="location.href='/dash'" class="text-sm bg-white/10 px-4 py-2 rounded-xl hover:bg-white/20 transition">
                <i class="fas fa-arrow-left mr-2"></i> Volver
            </button>
        </div>
    </header>

    <main class="container mx-auto p-4 flex-grow max-w-5xl">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 mt-4">
            <div class="glass p-6 rounded-2xl border-l-4 border-[#c084fc] flex justify-between items-center">
                <div>
                    <p class="text-[10px] text-slate-400 uppercase font-black tracking-widest">Base de Datos</p>
                    <h3 id="total-count" class="text-3xl font-black text-white mt-1">0 Usuarios</h3>
                </div>
                <div class="bg-purple-500/10 p-4 rounded-xl"><i class="fas fa-users text-[#c084fc] text-xl"></i></div>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-2 mb-6">
            <button onclick="filterUsers('all')" id="btn-all" class="btn-filter active">TODOS</button>
            <button onclick="filterUsers('premium')" id="btn-premium" class="btn-filter">PREMIUMS</button>
            <button onclick="filterUsers('admin')" id="btn-admin" class="btn-filter">ADMINS</button>
        </div>

        <div class="glass rounded-3xl overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-white/5 text-[10px] uppercase tracking-widest text-slate-500">
                        <tr>
                            <th class="p-5 font-black">Usuario / Email</th>
                            <th class="p-5 font-black">Rango</th>
                            <th class="p-5 font-black">Consumo</th>
                            <th class="p-5 text-center font-black">Gestión</th>
                        </tr>
                    </thead>
                    <tbody id="user-table-body" class="text-sm">
                        <tr><td colspan="4" class="p-10 text-center text-slate-500 font-black animate-pulse uppercase">Cargando Protocolos...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const userData = JSON.parse(localStorage.getItem('kazuma_user'));
        let allUsers = [];
        const SUPER_ADMIN = "luisxit222@gmail.com";

        if (!userData || userData.role !== 'admin') {
            window.location.href = '/dash';
        } else {
            document.body.style.display = 'block';
            loadUsers();
            loadTheme();
        }

        function toggleTheme() {
            const body = document.body;
            const themeBtn = document.getElementById('theme-btn');
            const icon = themeBtn.querySelector('i');
            body.classList.toggle('light-mode');
            const isLight = body.classList.contains('light-mode');
            icon.classList.replace(isLight ? 'fa-moon' : 'fa-sun', isLight ? 'fa-sun' : 'fa-moon');
            localStorage.setItem('dvwilker-theme', isLight ? 'light' : 'dark');
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('dvwilker-theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
                document.getElementById('theme-btn').querySelector('i').classList.replace('fa-moon', 'fa-sun');
            }
        }

        async function loadUsers() {
            try {
                const res = await fetch(`/api/auth/admin/all?apiKey=${userData.key}`);
                const data = await res.json();
                if (data.status) {
                    allUsers = data.users;
                    document.getElementById('total-count').innerText = `${allUsers.length} Usuarios`;
                    renderTable(allUsers);
                }
            } catch (e) { console.error(e); }
        }

        function renderTable(list) {
            const body = document.getElementById('user-table-body');
            body.innerHTML = list.map(u => {
                const isMe = u.email === SUPER_ADMIN;
                return `
                <tr class="hover:bg-purple-500/5">
                    <td class="p-5">
                        <div class="font-black ${isMe ? 'text-purple-400' : 'text-current'} text-sm">${u.username}</div>
                        <div class="text-[10px] text-slate-500 font-mono uppercase">${u.email}</div>
                    </td>
                    <td class="p-5">
                        <span class="text-[9px] font-black px-3 py-1 rounded-lg ${u.role === 'admin' ? 'badge-premium' : 'badge-user'}">
                            ${u.role.toUpperCase()}
                        </span>
                    </td>
                    <td class="p-5 text-xs font-black text-white/70">
                        ${u.requestToday || 0} <span class="text-slate-600">/</span> ${u.limit}
                    </td>
                    <td class="p-5 text-center">
                        ${isMe ? '<i class="fas fa-lock text-slate-600"></i>' : 
                        `<button onclick="openEdit('${u.email}')" class="bg-white/5 hover:bg-purple-500/20 hover:text-purple-400 w-10 h-10 rounded-xl transition-all border border-purple-500/20"><i class="fas fa-user-cog text-xs"></i></button>`}
                    </td>
                </tr>`;
            }).join('');
        }

        function filterUsers(type) {
            document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${type}`).classList.add('active');
            if (type === 'all') renderTable(allUsers);
            else renderTable(allUsers.filter(u => u.role === type));
        }

        async function openEdit(email) {
            const u = allUsers.find(user => user.email === email);
            const { value: formValues, isDenied } = await Swal.fire({
                title: '<span style="color:#c084fc; font-weight:900; letter-spacing:-1px;">GESTIÓN STAFF</span>',
                background: 'var(--card-bg)',
                color: 'var(--text-main)',
                width: '450px',
                html: `
                    <div style="text-align:left; margin-top:10px;">
                        <span class="swal-label">Nombre de Usuario</span>
                        <input id="swal-user" class="input-dark w-full p-3 rounded-xl mb-4 outline-none" value="${u.username}">
                        
                        <span class="swal-label">Correo Electrónico</span>
                        <input id="swal-email" class="input-dark w-full p-3 rounded-xl mb-4 outline-none" value="${u.email}">

                        <span class="swal-label">Contraseña de Acceso</span>
                        <input id="swal-pass" class="input-dark w-full p-3 rounded-xl mb-4 outline-none" value="${u.password}">

                        <span class="swal-label">Llave Maestra (API KEY)</span>
                        <input id="swal-key" class="input-dark w-full p-3 rounded-xl mb-4 outline-none font-mono text-purple-400" value="${u.key}">

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <span class="swal-label">Rango</span>
                                <select id="swal-role" class="input-dark w-full p-3 rounded-xl outline-none">
                                    <option value="user" ${u.role === 'user' ? 'selected' : ''}>USER</option>
                                    <option value="premium" ${u.role === 'premium' ? 'selected' : ''}>PREMIUM</option>
                                    <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>ADMIN</option>
                                </select>
                            </div>
                            <div>
                                <span class="swal-label">Límite Diario</span>
                                <input id="swal-limit" type="number" class="input-dark w-full p-3 rounded-xl outline-none" value="${u.limit}">
                            </div>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                showDenyButton: true,
                confirmButtonText: 'GUARDAR CAMBIOS',
                denyButtonText: 'ELIMINAR CUENTA',
                confirmButtonColor: '#c084fc',
                denyButtonColor: '#4a5568',
                customClass: {
                    confirmButton: 'rounded-2xl font-black px-6 py-4',
                    denyButton: 'rounded-2xl font-black text-[10px]'
                }
            });

            if (formValues) {
                const newData = {
                    username: document.getElementById('swal-user').value,
                    email: document.getElementById('swal-email').value,
                    password: document.getElementById('swal-pass').value,
                    key: document.getElementById('swal-key').value,
                    role: document.getElementById('swal-role').value,
                    limit: parseInt(document.getElementById('swal-limit').value),
                    plan: document.getElementById('swal-role').value === 'user' ? 'free' : 'premium'
                };
                updateUser(email, newData);
            } else if (isDenied) {
                deleteUser(email);
            }
        }

        async function updateUser(email, newData) {
            const res = await fetch('/api/auth/admin/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminKey: userData.key, targetEmail: email, newData })
            });
            if (res.ok) {
                Swal.fire({ icon: 'success', title: 'Protocolo Actualizado', background: 'var(--card-bg)', color: 'var(--text-main)', showConfirmButton: false, timer: 1000 });
                loadUsers();
            }
        }

        async function deleteUser(email) {
            const confirm = await Swal.fire({
                title: '¿ELIMINAR?',
                text: "Esta acción es irreversible.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#c084fc',
                background: 'var(--card-bg)',
                color: 'var(--text-main)'
            });
            if (confirm.isConfirmed) {
                const res = await fetch('/api/auth/admin/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminKey: userData.key, targetEmail: email })
                });
                if (res.ok) loadUsers();
            }
        }
    </script>
</body>
</html>
